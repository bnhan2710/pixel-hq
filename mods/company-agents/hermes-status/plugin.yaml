name: pixel-hq-status
version: 1.3.0
description: "Reports Hermes Agent's status to the Herdr app (OSC 7501) so Pixel HQ gives it a desk: working, blocked on approvals or questions, idle. Labels the terminal with how full the context is."
author: "Pixel HQ"
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - post_api_request
  - pre_tool_call
  - agent_loop_stopped
  - pre_approval_request
  - post_approval_response
  - on_human_input_request
  - on_human_input_resolved
  - subagent_start
