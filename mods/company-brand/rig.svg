<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Antenna with flashing beacon -->
  <rect x="3" y="0" width="2" height="2" fill="#f38ba8" />
  <rect x="3" y="2" width="1" height="3" fill="#6c7086" />
  <!-- Mainframe tower (Left) -->
  <rect x="2" y="5" width="4" height="10" fill="#45475a" />
  <rect x="3" y="6" width="2" height="1" fill="#a6e3a1" />
  <rect x="3" y="8" width="2" height="1" fill="#89dceb" />
  <rect x="3" y="10" width="2" height="1" fill="#f9e2af" />
  <rect x="3" y="12" width="2" height="2" fill="#313244" />
  <!-- CRT Monitor (Right) -->
  <rect x="7" y="4" width="8" height="7" fill="#585b70" />
  <rect x="8" y="5" width="6" height="5" fill="#181825" />
  <rect x="9" y="6" width="4" height="3" fill="#89dceb" />
  <rect x="10" y="7" width="2" height="1" fill="#ffffff" />
  <!-- Stand & Keyboard -->
  <rect x="10" y="11" width="2" height="1" fill="#45475a" />
  <rect x="7" y="12" width="8" height="2" fill="#313244" />
  <rect x="8" y="12" width="6" height="1" fill="#fab387" />
  <!-- Plus badge top right -->
  <rect x="13" y="1" width="3" height="1" fill="#a6e3a1" />
  <rect x="14" y="0" width="1" height="3" fill="#a6e3a1" />
</svg>
