<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Outer elevator shaft frame -->
  <rect x="2" y="1" width="12" height="14" fill="#45475a" />
  <rect x="3" y="2" width="10" height="12" fill="#181825" />
  <!-- Center split doors -->
  <rect x="4" y="5" width="3" height="8" fill="#313244" />
  <rect x="9" y="5" width="3" height="8" fill="#313244" />
  <rect x="7" y="5" width="2" height="8" fill="#11111b" />
  <!-- Level indicator floor panel on top -->
  <rect x="4" y="2" width="8" height="2" fill="#f9e2af" />
  <!-- Up Green Arrow -->
  <rect x="5" y="7" width="1" height="3" fill="#a6e3a1" />
  <rect x="4" y="8" width="3" height="1" fill="#a6e3a1" />
  <!-- Down Blue Arrow -->
  <rect x="10" y="7" width="1" height="3" fill="#89b4fa" />
  <rect x="9" y="9" width="3" height="1" fill="#89b4fa" />
</svg>
