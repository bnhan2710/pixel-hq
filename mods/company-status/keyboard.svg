<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" width="14" height="14" shape-rendering="crispEdges">
  <!-- Retro pixel keyboard chassis -->
  <rect x="1" y="4" width="12" height="8" fill="#45475a" />
  <rect x="2" y="5" width="10" height="6" fill="#1e1e2e" />
  <!-- Keys (top row) -->
  <rect x="3" y="6" width="1" height="1" fill="#89b4fa" />
  <rect x="5" y="6" width="1" height="1" fill="#89dceb" />
  <rect x="7" y="6" width="1" height="1" fill="#89b4fa" />
  <rect x="9" y="6" width="2" height="1" fill="#f9e2af" />
  <!-- Keys (bottom row & spacebar) -->
  <rect x="3" y="8" width="1" height="1" fill="#a6e3a1" />
  <rect x="5" y="8" width="4" height="1" fill="#89dceb" />
  <rect x="10" y="8" width="1" height="1" fill="#a6e3a1" />
  <!-- Cable top -->
  <rect x="6" y="2" width="2" height="2" fill="#89b4fa" />
  <rect x="7" y="1" width="3" height="1" fill="#89b4fa" />
</svg>
