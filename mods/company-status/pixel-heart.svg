<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" width="14" height="14" shape-rendering="crispEdges">
  <!-- 8-bit pixel heart with sparkle -->
  <rect x="2" y="1" width="3" height="1" fill="#f38ba8" />
  <rect x="9" y="1" width="3" height="1" fill="#f38ba8" />
  <rect x="1" y="2" width="5" height="1" fill="#f38ba8" />
  <rect x="8" y="2" width="5" height="1" fill="#f38ba8" />
  <rect x="0" y="3" width="14" height="3" fill="#f38ba8" />
  <rect x="1" y="6" width="12" height="2" fill="#f38ba8" />
  <rect x="2" y="8" width="10" height="2" fill="#f38ba8" />
  <rect x="4" y="10" width="6" height="2" fill="#f38ba8" />
  <rect x="6" y="12" width="2" height="1" fill="#f38ba8" />
  <!-- White highlight sparkle -->
  <rect x="2" y="2" width="2" height="2" fill="#ffffff" />
  <!-- Shadow border -->
  <rect x="1" y="5" width="1" height="2" fill="#d20f39" />
  <rect x="12" y="5" width="1" height="2" fill="#d20f39" />
</svg>
