<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" width="14" height="14" shape-rendering="crispEdges">
  <!-- Box body (cardboard) -->
  <rect x="2" y="3" width="10" height="10" fill="#fab387" />
  <rect x="1" y="4" width="12" height="8" fill="#fab387" />
  <!-- Green ribbon / bow -->
  <rect x="6" y="2" width="2" height="11" fill="#a6e3a1" />
  <rect x="2" y="7" width="10" height="2" fill="#a6e3a1" />
  <!-- Bow knot top -->
  <rect x="4" y="1" width="2" height="2" fill="#a6e3a1" />
  <rect x="8" y="1" width="2" height="2" fill="#a6e3a1" />
  <!-- Little golden star on ribbon -->
  <rect x="6" y="7" width="2" height="2" fill="#f9e2af" />
