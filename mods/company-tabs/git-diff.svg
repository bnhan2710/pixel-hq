<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Git branch line -->
  <rect x="3" y="3" width="2" height="10" fill="#b4befe" />
  <rect x="5" y="8" width="5" height="2" fill="#b4befe" />
  <rect x="8" y="5" width="2" height="3" fill="#b4befe" />
  <!-- Commit nodes -->
  <rect x="2" y="2" width="4" height="4" fill="#cba6f7" />
  <rect x="3" y="3" width="2" height="2" fill="#181825" />
  <rect x="2" y="10" width="4" height="4" fill="#89b4fa" />
  <rect x="3" y="11" width="2" height="2" fill="#181825" />
  <rect x="7" y="3" width="4" height="4" fill="#f9e2af" />
  <rect x="8" y="4" width="2" height="2" fill="#181825" />
  <!-- Mini green plus and red minus badge -->
  <rect x="12" y="3" width="3" height="1" fill="#a6e3a1" />
  <rect x="13" y="2" width="1" height="3" fill="#a6e3a1" />
  <rect x="12" y="11" width="3" height="1" fill="#f38ba8" />
</svg>
