<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Glowing golden plus -->
  <rect x="7" y="2" width="2" height="12" fill="#f9e2af" />
  <rect x="2" y="7" width="12" height="2" fill="#f9e2af" />
  <!-- Bevel highlights -->
  <rect x="6" y="3" width="1" height="4" fill="#fab387" />
  <rect x="3" y="6" width="4" height="1" fill="#fab387" />
  <rect x="9" y="9" width="1" height="4" fill="#f38ba8" />
  <rect x="9" y="9" width="4" height="1" fill="#f38ba8" />
  <!-- Little 4-point sparkle in corner -->
  <rect x="12" y="2" width="1" height="3" fill="#89dceb" />
  <rect x="11" y="3" width="3" height="1" fill="#89dceb" />
</svg>
